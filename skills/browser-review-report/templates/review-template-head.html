<title>Matthias-Runde 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F4F6F8;
    --paper: #FFFFFF;
    --ink: #0E141B;
    --text: #2A3441;
    --muted: #5C6B7A;
    --line: #D6DCE3;
    --line-strong: #B9C2CC;
    --accent: #8BC34B;
    --accent-ink: #4E7A1E;
    --accent-soft: #EEF6E2;
    --ok: #3E8E41;
    --warn: #B7791F;
    --fail: #B3261E;
    --ok-soft: #E6F3E6;
    --warn-soft: #FBF1DE;
    --fail-soft: #F9E3E1;
    --shadow: 0 1px 2px rgba(14, 20, 27, .06), 0 8px 24px rgba(14, 20, 27, .06);
    --display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    --body: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E141B;
      --paper: #161E27;
      --ink: #F2F5F8;
      --text: #D5DCE4;
      --muted: #8C9AAA;
      --line: #2A3441;
      --line-strong: #3B4756;
      --accent: #9DD35C;
      --accent-ink: #C5E89A;
      --accent-soft: #1E2B18;
      --ok: #7CC97F;
      --warn: #E2B25C;
      --fail: #F08A82;
      --ok-soft: #1B2E1C;
      --warn-soft: #33290F;
      --fail-soft: #3A1A18;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E141B;
    --paper: #161E27;
    --ink: #F2F5F8;
    --text: #D5DCE4;
    --muted: #8C9AAA;
    --line: #2A3441;
    --line-strong: #3B4756;
    --accent: #9DD35C;
    --accent-ink: #C5E89A;
    --accent-soft: #1E2B18;
    --ok: #7CC97F;
    --warn: #E2B25C;
    --fail: #F08A82;
    --ok-soft: #1B2E1C;
    --warn-soft: #33290F;
    --fail-soft: #3A1A18;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.55;
    padding-inline: clamp(16px, 4vw, 48px);
    padding-block: 0 64px;
  }
  a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); color: var(--ink); text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(30px, 4.2vw, 46px); font-weight: 700; line-height: 1.08; letter-spacing: -0.01em; }
  h2 { font-size: clamp(22px, 2.4vw, 28px); font-weight: 700; line-height: 1.2; }
  h3 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--body); }
  p { margin: 0; max-width: 68ch; }
  code, .mono { font-family: var(--mono); font-size: .92em; }

  .hero {
    max-width: 1080px; margin: 0 auto; padding-block: 48px 28px;
    border-bottom: 1px solid var(--line);
    display: grid; gap: 18px;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent-ink);
  }
  .lede { font-size: 19px; color: var(--text); max-width: 64ch; }
  .facts {
    list-style: none; margin: 8px 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
  }
  .facts li {
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 14px; display: grid; gap: 4px;
  }
  .facts span { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .facts strong { font-family: var(--mono); font-weight: 500; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }

  .toc { max-width: 1080px; margin: 0 auto; padding-block: 20px; }
  .toc ol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 18px; counter-reset: toc; }
  .toc li { counter-increment: toc; font-size: 15px; }
  .toc li::before { content: counter(toc) " "; font-family: var(--mono); color: var(--muted); font-size: 12px; margin-right: 4px; }
  .toc a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  .toc a:hover { border-bottom-color: var(--accent); }

  .block {
    max-width: 1080px; margin: 28px auto 0; padding: 28px clamp(18px, 3vw, 32px) 30px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
    display: grid; gap: 22px;
  }
  .block-head { display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: start; }
  .num {
    width: 44px; height: 44px; border-radius: 6px; display: grid; place-items: center;
    background: var(--ink); color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 20px;
  }
  .status {
    margin-top: 8px; display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: .02em;
    padding: 3px 10px; border-radius: 999px;
  }
  .status.ok { background: var(--ok-soft); color: var(--ok); }
  .status.warn { background: var(--warn-soft); color: var(--warn); }
  .status.fail { background: var(--fail-soft); color: var(--fail); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col { display: grid; gap: 8px; align-content: start; }
  .col p { max-width: none; }
  .col:first-child { border-right: 1px solid var(--line); padding-right: 24px; }
  .col:first-child p { color: var(--muted); }
  .review {
    max-width: none; padding: 12px 14px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: 16px;
  }
  .review strong { color: var(--accent-ink); }

  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .shots figure { margin: 0; display: grid; gap: 8px; }
  .shots img {
    width: 100%; max-width: 100%; height: auto; display: block;
    border: 1px solid var(--line-strong); border-radius: 4px; background: var(--ground);
  }
  .shots figcaption { font-family: var(--mono); font-size: 12.5px; line-height: 1.45; color: var(--muted); }

  .findings ul, .todo p { margin: 0; }
  .findings ul { padding: 0; list-style: none; display: grid; gap: 12px; }
  .findings li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; font-size: 16px; }
  .sev { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; white-space: nowrap; margin-top: 2px; }
  .sev.hoch { background: var(--fail-soft); color: var(--fail); }
  .sev.mittel { background: var(--warn-soft); color: var(--warn); }
  .sev.niedrig { background: var(--ground); color: var(--muted); border: 1px solid var(--line); }
  .sev.info { background: var(--accent-soft); color: var(--accent-ink); }
  .todo { border-color: var(--warn); }
  .todo .num { background: var(--warn-soft); color: var(--warn); }
  .todo p { max-width: none; }

  .foot { max-width: 1080px; margin: 36px auto 0; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }

  @media (max-width: 720px) {
    .cols { grid-template-columns: 1fr; }
    .col:first-child { border-right: 0; padding-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
    .block-head { grid-template-columns: 36px 1fr; gap: 12px; }
    .num { width: 36px; height: 36px; font-size: 17px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .shots img { transition: transform .2s ease; }
    .shots img:hover { transform: translateY(-2px); }
  }
</style>
